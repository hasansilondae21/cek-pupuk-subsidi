<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Penebusan Pupuk Subsidi — BPP Unaaha</title>
<meta name="theme-color" content="#1a56a0">
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#f1f5f9;font-family:system-ui,sans-serif}
  iframe{width:100%;height:100vh;height:100dvh;border:none;display:block}
  .info{padding:24px;text-align:center;color:#334155}
  .info a{color:#1a56a0;font-weight:600}
</style>
</head>
<body>
<iframe id="app" title="Penebusan Pupuk Subsidi" allowfullscreen></iframe>
<noscript><div class="info">Aktifkan JavaScript, atau <a href="https://script.google.com/macros/s/AKfycby4DhxSTRKLOACJ4to5WZvOxsvOj7PS8RRB2Lm5ClXuh-9ISoXaCBEIQ6TxDEQHuugO/exec">buka aplikasi langsung</a>.</div></noscript>
<script>
  var BASE = "https://script.google.com/macros/s/AKfycby4DhxSTRKLOACJ4to5WZvOxsvOj7PS8RRB2Lm5ClXuh-9ISoXaCBEIQ6TxDEQHuugO/exec";

  // MODE "iframe"   : aplikasi tampil di dalam halaman ini (alamat GitHub tetap).
  // MODE "redirect" : pengunjung langsung dialihkan ke aplikasi. Pakai ini bila iframe diblokir
  //                   di jaringan/perangkat tertentu ("connection is blocked ... local network").
  var MODE = "iframe";

  var tujuan = BASE + (location.search || '');   // ?h=daftar&desa=ASAMBU ikut diteruskan
  if (MODE === "redirect") {
    location.replace(tujuan);
  } else {
    document.getElementById('app').src = tujuan;
  }
</script>
</body>
</html>
